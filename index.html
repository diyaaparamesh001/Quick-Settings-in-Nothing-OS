<html lang="en"><head><meta charset="utf-8">

<title>Aeroplane Mode Prototype</title>
<style>
:root{--bg:#e9e9ec;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1a1c}}
:root[data-theme="dark"]{--bg:#1a1a1c}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center}
.phone{container-type:inline-size;position:relative;height:100%;max-height:100vh;aspect-ratio:365/812;max-width:100%;overflow:hidden;background:rgb(15,13,14)}
.phone img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.base{width:100%;height:100%}
.abs{position:absolute}
.btn-on{left:6.027%;top:42.857%;width:17.534%;height:7.882%;opacity:0;transform:scale(.6);transition:opacity .22s ease,transform .3s cubic-bezier(.2,1.3,.4,1)}
.on .btn-on{opacity:1;transform:scale(1)}
.clip{overflow:hidden}
.txt-clip{left:0.000%;top:16.010%;width:100.000%;height:5.911%}
.txt{position:absolute;left:0;top:21.875%;width:100%;height:41.667%;opacity:0;transform:translateY(220%);text-align:center;color:#fff;font-family:Roboto,"Google Sans","Segoe UI",system-ui,sans-serif;line-height:2.74cqw;white-space:nowrap;pointer-events:none}
.txt b{display:block;font-weight:500;font-size:2.3cqw;color:#fff;letter-spacing:0.04em}
.txt span{display:block;font-weight:400;font-size:2.06cqw;color:#fff;letter-spacing:0.04em}
.txt.in{animation:txtIn .55s cubic-bezier(.16,1,.3,1) forwards}
.txt.out{animation:txtOut .4s ease-in forwards}
@keyframes txtIn{from{opacity:0;transform:translateY(220%)}to{opacity:1;transform:translateY(0)}}
@keyframes txtOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(220%)}}
.pl-clip{left:77.808%;top:5.419%;width:6.027%;height:16.502%}
.plane{position:absolute;left:9.091%;top:2.985%;width:81.818%;height:14.925%;opacity:0;transform:translateY(640%)}
.on .plane{animation:plIn .75s .05s cubic-bezier(.16,1,.3,1) forwards}
@keyframes plIn{from{opacity:0;transform:translateY(640%)}to{opacity:1;transform:translateY(0)}}
.hotspot{left:6.575%;top:43.103%;width:16.438%;height:7.389%;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.hotspot:focus-visible{box-shadow:0 0 0 2px #fff}
</style></head><body>

  <button class="abs hotspot" id="airplane" aria-label="Aeroplane mode"></button>
</div>
<script>
var phone=document.getElementById("phone"), txt=document.getElementById("txt"), t1, t2;
function reset(){ clearTimeout(t1); clearTimeout(t2); txt.className="txt"; txt.style.animation="none"; void txt.offsetWidth; txt.style.animation=""; }
function turnOn(){
  reset(); phone.classList.add("on");
  txt.classList.add("in");
  t1=setTimeout(function(){ txt.classList.remove("in"); txt.classList.add("out"); }, 550+4000);
}
function turnOff(){ reset(); phone.classList.remove("on"); }
document.getElementById("airplane").addEventListener("click", function(){
  phone.classList.contains("on") ? turnOff() : turnOn();
});
</script>
